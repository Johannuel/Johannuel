<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="500" viewBox="0 0 1500 500">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&amp;family=Rajdhani:wght@300;500;700&amp;display=swap');

    @keyframes rise {
      0%   { transform: translateY(0);    opacity: 0; }
      10%  { opacity: 0.55; }
      90%  { opacity: 0.35; }
      100% { transform: translateY(-150px); opacity: 0; }
    }
    @keyframes float {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-70px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    @keyframes shimmer {
      0%   { transform: translateX(-260px); }
      100% { transform: translateX(980px); }
    }
    @keyframes flip {
      0%, 100% { transform: scaleX(1); }
      12%, 28% { transform: scaleX(0.08); }
      40%      { transform: scaleX(1); }
    }
    @keyframes faceA {
      0%, 10% { opacity: 1; }
      16%, 34% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
    @keyframes faceB {
      0%, 10% { opacity: 0; }
      16%, 34% { opacity: 1; }
      40%, 100% { opacity: 0; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.12; }
      50%      { opacity: 0.7; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    .rise  { animation: rise 10s linear infinite; transform-box: fill-box; }
    .rise2 { animation: rise 14s linear infinite; transform-box: fill-box; }
    .rise3 { animation: rise 18s linear infinite; transform-box: fill-box; }
    .wave  { animation: float 16s ease-in-out infinite alternate; }
    .wave2 { animation: float 22s ease-in-out infinite alternate-reverse; }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    .spin  { animation: spin 28s linear infinite; transform-origin: center; transform-box: fill-box; }
    .spin-fast { animation: spin 12s linear infinite; transform-origin: center; transform-box: fill-box; }
    .shimmer { animation: shimmer 5s linear infinite; }
    .shimmer2 { animation: shimmer 5s linear infinite; animation-delay: 2.5s; }
    .flipcard { animation: flip 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .face-a { animation: faceA 6s ease-in-out infinite; }
    .face-b { animation: faceB 6s ease-in-out infinite; }
    .twinkle { animation: twinkle 3.5s ease-in-out infinite; }
    .bob { animation: bob 6s ease-in-out infinite; transform-box: fill-box; }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="55%" stop-color="#0B2A5B"/>
      <stop offset="100%" stop-color="#1269CC"/>
    </linearGradient>
    <radialGradient id="lunaHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CFE3FF" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#CFE3FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#CFE3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubbleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#51EEFC" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#51EEFC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#51EEFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#51EEFC"/>
      <stop offset="45%" stop-color="#F2F7FF"/>
      <stop offset="100%" stop-color="#51EEFC"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#51EEFC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#51EEFC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#51EEFC" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="titleClip">
      <text x="575" y="305" font-family="Rajdhani" font-weight="700" font-size="124" transform="skewX(-6)">MF CODER</text>
    </clipPath>
    <path id="sealArc" d="M 0 -62 A 62 62 0 1 1 -0.01 -62" fill="none"/>
    <path id="sealArc2" d="M 0 -54 A 54 54 0 1 0 -0.01 -54" fill="none"/>
  </defs>

  <!-- ===== fondo ===== -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>

  <!-- bandas diagonales de profundidad -->
  <g stroke="#6D9AC7" stroke-opacity="0.07" stroke-width="2">
    <line x1="-100" y1="120" x2="500" y2="-60"/>
    <line x1="-100" y1="260" x2="700" y2="-60"/>
    <line x1="600" y1="560" x2="1300" y2="240"/>
    <line x1="900" y1="560" x2="1600" y2="240"/>
  </g>

  <!-- ===== luna ===== -->
  <g class="pulse">
    <circle cx="175" cy="180" r="175" fill="url(#lunaHalo)"/>
    <circle cx="175" cy="180" r="88" fill="#F2F7FF" fill-opacity="0.92"/>
    <circle cx="175" cy="180" r="88" fill="none" stroke="#51EEFC" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="175" cy="180" r="98" fill="none" stroke="#6D9AC7" stroke-opacity="0.3" stroke-width="1"/>
    <!-- cráteres -->
    <circle cx="150" cy="160" r="9" fill="#9FB8D8" fill-opacity="0.55"/>
    <circle cx="198" cy="150" r="6" fill="#9FB8D8" fill-opacity="0.4"/>
    <circle cx="176" cy="212" r="7" fill="#9FB8D8" fill-opacity="0.45"/>
  </g>

  <!-- ===== Memento Mori ===== -->
  <g>
    <text x="85" y="108" font-family="UnifrakturMaguntia" font-size="52" fill="#F2F7FF" fill-opacity="0.95">Memento Mori</text>
    <text x="90" y="148" font-family="Rajdhani" font-weight="500" font-size="19" letter-spacing="9" fill="#51EEFC">RELOAD</text>
    <line x1="90" y1="162" x2="240" y2="162" stroke="#51EEFC" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="240" cy="162" r="3" fill="#C9A24B" fill-opacity="0.9"/>
  </g>

  <!-- ===== caustics de agua ===== -->
  <path class="wave" d="M0 400 Q 150 376 300 400 T 600 400 T 900 400 T 1200 400 T 1500 400" fill="none" stroke="#51EEFC" stroke-opacity="0.13" stroke-width="2"/>
  <path class="wave2" d="M0 436 Q 150 460 300 436 T 600 436 T 900 436 T 1200 436 T 1500 436" fill="none" stroke="#51EEFC" stroke-opacity="0.1" stroke-width="2"/>
  <path class="wave" d="M0 468 Q 150 452 300 468 T 600 468 T 900 468 T 1200 468 T 1500 468" fill="none" stroke="#6D9AC7" stroke-opacity="0.14" stroke-width="2"/>

  <!-- ===== burbujas ===== -->
  <g>
    <circle class="rise"  cx="120" cy="430" r="26" fill="url(#bubbleGrad)" style="animation-delay: 0s"/>
    <circle class="rise"  cx="120" cy="430" r="26" fill="none" stroke="#51EEFC" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle class="rise2" cx="330" cy="480" r="38" fill="url(#bubbleGrad)" style="animation-delay: 3s"/>
    <circle class="rise2" cx="330" cy="480" r="38" fill="none" stroke="#51EEFC" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle class="rise3" cx="700" cy="420" r="16" fill="url(#bubbleGrad)" style="animation-delay: 1.5s"/>
    <circle class="rise3" cx="700" cy="420" r="16" fill="none" stroke="#51EEFC" stroke-opacity="0.4" stroke-width="1"/>
    <circle class="rise"  cx="950" cy="470" r="22" fill="url(#bubbleGrad)" style="animation-delay: 5s"/>
    <circle class="rise"  cx="950" cy="470" r="22" fill="none" stroke="#51EEFC" stroke-opacity="0.4" stroke-width="1"/>
    <circle class="rise2" cx="1420" cy="450" r="30" fill="url(#bubbleGrad)" style="animation-delay: 2s"/>
    <circle class="rise2" cx="1420" cy="450" r="30" fill="none" stroke="#51EEFC" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle class="rise3" cx="1150" cy="440" r="12" fill="url(#bubbleGrad)" style="animation-delay: 7s"/>
    <circle class="rise3" cx="1150" cy="440" r="12" fill="none" stroke="#51EEFC" stroke-opacity="0.45" stroke-width="1"/>
  </g>

  <!-- ===== sparkles ===== -->
  <g fill="#F2F7FF">
    <circle class="twinkle" cx="480" cy="90" r="2" style="animation-delay: 0.4s"/>
    <circle class="twinkle" cx="610" cy="150" r="1.6" style="animation-delay: 1.2s"/>
    <circle class="twinkle" cx="870" cy="70" r="2.2" style="animation-delay: 2.1s"/>
    <circle class="twinkle" cx="1040" cy="130" r="1.5" style="animation-delay: 0.9s"/>
    <circle class="twinkle" cx="1350" cy="110" r="2" style="animation-delay: 1.7s"/>
    <circle class="twinkle" cx="300" cy="320" r="1.6" style="animation-delay: 2.6s"/>
    <circle class="twinkle" cx="700" cy="240" r="1.5" style="animation-delay: 0.2s"/>
    <circle class="twinkle" cx="1390" cy="330" r="1.8" style="animation-delay: 3.1s"/>
  </g>

  <!-- ===== titulo MF CODER ===== -->
  <text x="575" y="305" font-family="Rajdhani" font-weight="700" font-size="124" transform="skewX(-6)" fill="url(#titleGrad)" filter="url(#glow)">MF CODER</text>

  <!-- bandas de agua sobre el titulo -->
  <g clip-path="url(#titleClip)">
    <rect class="shimmer" x="0" y="160" width="90" height="140" fill="url(#shimmerGrad)" transform="skewX(-15)"/>
    <rect class="shimmer2" x="0" y="160" width="90" height="140" fill="url(#shimmerGrad)" transform="skewX(-15)"/>
  </g>

  <!-- ===== tagline ===== -->
  <text x="575" y="350" font-family="Rajdhani" font-weight="300" font-size="25" letter-spacing="8" fill="#6D9AC7">[ RUST · LINUX · DEVOPS ]</text>
  <line x1="575" y1="368" x2="930" y2="368" stroke="#1269CC" stroke-opacity="0.6" stroke-width="1"/>

  <!-- ===== sello SEES ===== -->
  <g transform="translate(230, 352)">
    <g class="spin">
      <circle r="80" fill="none" stroke="#51EEFC" stroke-opacity="0.55" stroke-width="1.6"/>
      <circle r="70" fill="none" stroke="#6D9AC7" stroke-opacity="0.35" stroke-width="1"/>
      <text font-family="Rajdhani" font-weight="500" font-size="14" letter-spacing="3.5" fill="#F2F7FF" fill-opacity="0.9">
        <textPath href="#sealArc" startOffset="0">PHANTOM OF CODE · MF CODER ·</textPath>
      </text>
      <text font-family="Rajdhani" font-weight="500" font-size="11" letter-spacing="2.5" fill="#51EEFC" fill-opacity="0.75">
        <textPath href="#sealArc2" startOffset="0">EST · MMIX · SEES ·</textPath>
      </text>
    </g>
    <g class="spin-fast">
      <polygon points="0,-34 29,17 -29,17" fill="none" stroke="#51EEFC" stroke-opacity="0.8" stroke-width="1.5"/>
      <polygon points="0,-20 17,10 -17,10" fill="none" stroke="#C9A24B" stroke-opacity="0.95" stroke-width="1.5"/>
    </g>
    <circle r="6" fill="#C9A24B"/>
  </g>

  <!-- ===== tarjeta tarot ===== -->
  <g transform="translate(1285, 255)">
    <g class="flipcard">
      <!-- cara: THE FOOL 0 -->
      <g class="face-a">
        <rect x="-72" y="-108" width="144" height="216" rx="6" fill="#EAF3FF"/>
        <rect x="-66" y="-102" width="132" height="204" rx="3" fill="none" stroke="#C9A24B" stroke-width="2"/>
        <text x="0" y="-80" font-family="Rajdhani" font-weight="500" font-size="14" letter-spacing="3" fill="#1269CC" text-anchor="middle">THE FOOL</text>
        <text x="0" y="34" font-family="Rajdhani" font-weight="700" font-size="72" fill="#0B2A5B" text-anchor="middle">0</text>
        <circle cx="0" cy="30" r="16" fill="none" stroke="#C9A24B" stroke-width="1.5"/>
        <line x1="-34" y1="52" x2="34" y2="52" stroke="#C9A24B" stroke-opacity="0.8" stroke-width="1.5"/>
        <text x="0" y="80" font-family="Rajdhani" font-weight="500" font-size="13" letter-spacing="4" fill="#0B2A5B" text-anchor="middle">RELOAD</text>
      </g>
      <!-- dorso -->
      <g class="face-b">
        <rect x="-72" y="-108" width="144" height="216" rx="6" fill="#0B2A5B"/>
        <rect x="-66" y="-102" width="132" height="204" rx="3" fill="none" stroke="#51EEFC" stroke-opacity="0.8" stroke-width="1.5"/>
        <polygon points="0,-55 48,28 -48,28" fill="none" stroke="#51EEFC" stroke-opacity="0.7" stroke-width="1.5"/>
        <polygon points="0,-32 27,16 -27,16" fill="none" stroke="#C9A24B" stroke-opacity="0.9" stroke-width="1.5"/>
        <circle r="6" fill="#C9A24B"/>
      </g>
    </g>
  </g>

  <!-- ===== fecha + marco ===== -->
  <text x="1410" y="455" font-family="Rajdhani" font-weight="500" font-size="20" letter-spacing="4" fill="#51EEFC" fill-opacity="0.65" text-anchor="end">04.04.2009</text>
  <text x="90" y="455" font-family="Rajdhani" font-weight="500" font-size="14" letter-spacing="3" fill="#6D9AC7" fill-opacity="0.8">NO. 001</text>

  <rect x="16" y="16" width="1468" height="468" fill="none" stroke="#1269CC" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="24" y="24" width="1452" height="452" fill="none" stroke="#6D9AC7" stroke-opacity="0.22" stroke-width="1"/>

  <!-- esquinas doradas -->
  <g stroke="#C9A24B" stroke-opacity="0.95" stroke-width="3" fill="none">
    <path d="M16 44 V30 Q16 16 30 16 H52"/>
    <path d="M1448 16 H1470 Q1484 16 1484 30 V44"/>
    <path d="M1484 456 V470 Q1484 484 1470 484 H1448"/>
    <path d="M52 484 H30 Q16 484 16 470 V456"/>
  </g>

  <!-- reflejo de luna en el agua -->
  <g class="bob">
    <ellipse cx="175" cy="470" rx="46" ry="5" fill="#51EEFC" fill-opacity="0.28"/>
    <ellipse cx="175" cy="482" rx="26" ry="3" fill="#51EEFC" fill-opacity="0.18"/>
  </g>
</svg>
