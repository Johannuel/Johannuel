<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Johannuel — Rust Linux DevOps">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2E3C"/>
      <stop offset="55%" stop-color="#E8112D"/>
      <stop offset="100%" stop-color="#A80016"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stripes" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="52" fill="#E8112D" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- fondo -->
  <rect width="1280" height="320" fill="#0B0B0C"/>
  <rect width="1280" height="320" fill="url(#stripes)"/>

  <!-- franjas rojas superior e inferior -->
  <rect x="0" y="0" width="1280" height="5" fill="#E8112D"/>
  <rect x="0" y="315" width="1280" height="5" fill="#E8112D"/>

  <!-- esquinas angulares -->
  <polygon points="0,0 96,0 0,96" fill="#E8112D"/>
  <polygon points="1280,320 1184,320 1280,224" fill="#E8112D"/>
  <polygon points="1184,0 1280,0 1280,96" fill="#E8112D" opacity="0.4"/>
  <polygon points="0,320 0,224 96,320" fill="#E8112D" opacity="0.4"/>

  <!-- emblema angular izquierdo (estilo P) -->
  <g transform="translate(120,160)">
    <polygon points="0,-78 60,-78 60,-30 0,-30" fill="url(#redGrad)" filter="url(#softGlow)"/>
    <polygon points="0,-22 60,-22 30,38" fill="url(#redGrad)" filter="url(#softGlow)"/>
    <polygon points="12,44 48,44 30,86" fill="#E8112D"/>
  </g>

  <!-- titulo -->
  <g transform="skewX(-6)">
    <text x="660" y="178" text-anchor="middle" font-family="'Arial Black','Impact','Franklin Gothic Bold',sans-serif" font-size="118" font-weight="900" letter-spacing="12" fill="url(#redGrad)" filter="url(#glow)">JOHANNUEL</text>
  </g>

  <!-- tagline -->
  <text x="660" y="238" text-anchor="middle" font-family="'Courier New',monospace" font-size="26" letter-spacing="12" fill="#C8CDD3">RUST · LINUX · DEVOPS</text>

  <!-- flecha angular inferior -->
  <polygon points="660,262 676,286 644,286" fill="#E8112D"/>
</svg>
