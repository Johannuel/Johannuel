  <text x="1430" y="38" text-anchor="end" font-family="'Courier New',monospace" font-size="14" font-weight="bold" letter-spacing="3" fill="#E60012">NO. 001</text>
  <text x="1430" y="478" text-anchor="end" font-family="'Courier New',monospace" font-size="13" letter-spacing="3" fill="#555555">PHANTOM THIEF OF CODE</text>

